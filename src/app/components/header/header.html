<mat-toolbar color="primary" class="header-toolbar mat-elevation-z4">
  <span class="logo">Lusandre<span>.dev</span></span>

  <span class="spacer"></span>

  <div class="nav-links">
    <button mat-icon-button (click)="toggleLanguage()" aria-label="Cambiar idioma">
      <mat-icon>language</mat-icon>
      <span style="font-size: 0.5rem; font-weight: bold; margin-left: -7px">
        {{ currentLang() | uppercase }}
      </span>
    </button>

    <button mat-icon-button (click)="toggleTheme()" aria-label="Cambiar tema">
      <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <a mat-button href="https://github.com/Lusandre" target="_blank">
      <mat-icon>code</mat-icon> GitHub
    </a>
    <a mat-button href="https://linkedin.com/in/lusandre-marcano" target="_blank">
      <mat-icon>work</mat-icon> LinkedIn
    </a>
  </div>
</mat-toolbar>
