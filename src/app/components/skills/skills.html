<section class="skills-section">
  <h2 class="section-title">{{ 'PROJECTS.SKILL_SECTION_TITLE' | translate }}</h2>

  <div class="chips-container">
    <mat-chip-set aria-label="Habilidades Técnicas">
      @for (skill of skills; track skill) {
        <mat-chip class="custom-chip">{{ skill }}</mat-chip>
      }
    </mat-chip-set>
  </div>
</section>
