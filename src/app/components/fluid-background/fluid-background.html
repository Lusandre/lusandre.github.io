<div class="fluid-background-container" aria-hidden="true">
  <!-- Subtle mesh ambient gradient base -->
  <div class="mesh-layer"></div>

  <!-- Organic wave & fluid blobs with continuous morphing -->
  <div class="fluid-waves-wrapper">
    <div class="wave-blob blob-1"></div>
    <div class="wave-blob blob-2"></div>
    <div class="wave-blob blob-3"></div>
    <div class="wave-blob blob-4"></div>
    <div class="wave-blob blob-5"></div>
  </div>

  <!-- Interactive cursor glow & expanding wave ripple -->
  <div #cursorGlow class="cursor-wave-glow"></div>
  <div class="cursor-wave-ripple"></div>

  <!-- Backdrop blur blend overlay -->
  <div class="glass-overlay"></div>
</div>
